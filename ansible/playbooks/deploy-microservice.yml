---
- name: Deploy microservice to EKS
  hosts: localhost
  gather_facts: true
  vars:
    aws_region: "{{ aws_region | default('us-west-2') }}"
    cluster_name: "{{ eks_cluster_name | default('demo-eks-cluster') }}"
    microservice_name: "demo-microservice"
    microservice_image: "demo-microservice:latest"
    ecr_repository: ""
    
  tasks:
    - name: Install required Python packages
      pip:
        name:
          - kubernetes
          - boto3
          - botocore
        state: present
      delegate_to: localhost

    - name: Check if Maven is installed
      shell: which mvn
      register: maven_check
      ignore_errors: true
      delegate_to: localhost

    - name: Install Maven using Homebrew
      shell: |
        # Check if Homebrew is installed
        if ! command -v brew &> /dev/null; then
          echo "Homebrew not found. Installing Homebrew..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        
        # Install Maven
        brew install maven
      when: ansible_os_family == "Darwin" and maven_check.rc != 0
      delegate_to: localhost

    - name: Configure kubectl for EKS cluster
      shell: |
        aws eks update-kubeconfig --region {{ aws_region }} --name {{ cluster_name }}
      delegate_to: localhost
      when: cluster_name is defined

    - name: Check if ECR repository exists
      shell: |
        aws ecr describe-repositories --repository-names {{ microservice_name }} --region {{ aws_region }} 2>/dev/null || echo "not_found"
      register: ecr_check
      delegate_to: localhost

    - name: Create ECR repository if not exists
      shell: |
        aws ecr create-repository --repository-name {{ microservice_name }} --region {{ aws_region }}
      when: "'not_found' in ecr_check.stdout"
      delegate_to: localhost

    - name: Get ECR repository URI
      shell: |
        aws ecr describe-repositories --repository-names {{ microservice_name }} --region {{ aws_region }} --query 'repositories[0].repositoryUri' --output text
      register: ecr_uri
      delegate_to: localhost

    - name: Set ECR repository variable
      set_fact:
        ecr_repository: "{{ ecr_uri.stdout }}"

    - name: Login to ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_repository }}
      delegate_to: localhost

    - name: Debug paths
      debug:
        msg: 
          - "Project root is: {{ project_root }}"
          - "Playbook directory is: {{ playbook_dir }}"
          - "Current working directory is: {{ lookup('pipe', 'pwd') }}"
      
    - name: List directory contents
      shell: "ls -la {{ project_root }}"
      register: dir_contents
      delegate_to: localhost
      
    - name: Show directory contents
      debug:
        var: dir_contents.stdout_lines

    - name: Verify microservice directory exists
      stat:
        path: "{{ project_root }}/microservice"
      register: microservice_dir
      delegate_to: localhost

    - name: Show directory check result
      debug:
        msg: 
          - "Microservice directory status:"
          - "Exists: {{ microservice_dir.stat.exists | default(false) }}"
          - "Path checked: {{ project_root }}/microservice"

    - name: Fail if microservice directory doesn't exist
      fail:
        msg: |
          Microservice directory not found at {{ project_root }}/microservice
          Project root: {{ project_root }}
          Directory contents: {{ dir_contents.stdout }}
      when: not microservice_dir.stat.exists

    - name: Build Maven project
      shell: |
        cd "{{ project_root }}/microservice" && \
        mvn clean package -DskipTests
      register: maven_result
      delegate_to: localhost

    - name: Show Maven build result
      debug:
        var: maven_result

    - name: Build Docker image
      shell: |
        cd "{{ project_root }}/microservice" && \
        docker build -t {{ microservice_name }}:latest .
      register: docker_result
      delegate_to: localhost

    - name: Tag Docker image for ECR
      shell: |
        docker tag {{ microservice_name }}:latest {{ ecr_repository }}:latest
      delegate_to: localhost

    - name: Push image to ECR
      shell: |
        docker push {{ ecr_repository }}:latest
      delegate_to: localhost

    - name: Apply Kubernetes deployment
      k8s:
        state: present
        definition: "{{ lookup('template', project_root + '/microservice/k8s/deployment.yaml') | from_yaml }}"
        validate_certs: no
        namespace: default
      delegate_to: localhost
      vars:
        image_url: "{{ ecr_repository }}:latest"

    - name: Wait for deployment to be ready
      shell: |
        kubectl rollout status deployment/{{ microservice_name }} -n default --timeout=300s
      delegate_to: localhost
      register: rollout_status

    - name: Display rollout status
      debug:
        var: rollout_status.stdout_lines

    - name: Get deployment status
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ microservice_name }}"
        namespace: default
      register: deployment_status
      delegate_to: localhost

    - name: Display deployment status
      debug:
        var: deployment_status

    - name: Get service information
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "{{ microservice_name }}-service"
      register: service_info
      delegate_to: localhost

    - name: Display deployment information
      debug:
        msg: |
          Microservice deployment completed successfully!
          Service: {{ microservice_name }}-service
          Type: {{ service_info.resources[0].spec.type if service_info.resources else 'Unknown' }}
          {% if service_info.resources and service_info.resources[0].status.loadBalancer.ingress is defined %}
          Load Balancer URL: http://{{ service_info.resources[0].status.loadBalancer.ingress[0].hostname }}
          {% endif %}
          
          To check the status:
          kubectl get deployments
          kubectl get services
          kubectl get pods
          
          To test the service:
          kubectl port-forward service/{{ microservice_name }}-service 8080:80
          curl http://localhost:8080/health
